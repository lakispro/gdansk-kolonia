<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1712" />
<title>Kolonia 1920 — panel budynków</title>
<style>
  :root { color-scheme: dark; --ink: #f1e9d8; --dim: rgba(241,233,216,.6); --card: #221c14; --gold: #d9b45a; --line: rgba(217,180,90,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110d; color: var(--ink); font: 14px/1.45 Georgia, "Times New Roman", serif; }
  body { display: grid; grid-template-columns: 280px 1fr 340px; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0; font-size: 16px; color: var(--gold); font-weight: 700; }
  header .sub { color: var(--dim); font-size: 12px; }
  header a { color: var(--dim); margin-left: auto; font-size: 12px; }
  #list { overflow: auto; border-right: 1px solid var(--line); background: var(--card); }
  #list input { width: calc(100% - 16px); margin: 8px; padding: 7px 9px; border: 1px solid var(--line); background: #14110d; color: var(--ink); border-radius: 4px; font: inherit; }
  #list .item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.04); }
  #list .item:hover { background: rgba(217,180,90,.08); }
  #list .item.on { background: rgba(217,180,90,.18); }
  #list .item b { display: block; font-size: 14px; }
  #list .item small { color: var(--dim); font-size: 11.5px; }
  #list .grp { padding: 10px 12px 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  #stage { position: relative; background: #2a2620; }
  canvas#view { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--dim); text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hud b { color: var(--ink); font-size: 15px; display: block; }
  #tools { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; }
  .btn { padding: 7px 12px; border-radius: 4px; background: var(--gold); color: #1a1712; font-weight: 700; cursor: pointer; border: 0; font: inherit; font-size: 13px; }
  .btn.alt { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .btn:disabled { opacity: .4; }
  #side { overflow: auto; border-left: 1px solid var(--line); background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  #side h2 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  textarea { width: 100%; min-height: 150px; background: #14110d; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
  textarea#note { font: 14px/1.45 Georgia, serif; min-height: 110px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .msg { font-size: 12px; color: var(--dim); }
  .msg.ok { color: #9fd08a; } .msg.err { color: #e08a7a; }
  #refs img { width: 100%; border-radius: 4px; margin-top: 6px; display: block; }
  #refs .cap { font-size: 11.5px; color: var(--dim); margin-top: 3px; margin-bottom: 8px; }
  #refs .cap b { color: var(--gold); }
  #refs .tag { color: var(--ink); opacity: .7; }
  #refs .grp2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 10px 0 4px; border-top: 1px solid var(--line); padding-top: 6px; }
  #refs a.ph img { border: 1px solid var(--line); }
  #notes .n { border-top: 1px solid rgba(255,255,255,.06); padding: 6px 0; font-size: 13px; }
  #notes .n small { color: var(--dim); display: block; font-size: 11px; }
  #facts { font-size: 12.5px; color: #e2d8c4; }
  #facts div { margin-bottom: 3px; }
  #facts span { color: var(--dim); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 48px 34vh 44vh auto; }
    #list { border-right: 0; border-bottom: 1px solid var(--line); }
    #side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <header><h1>Kolonia 1920 · panel budynków</h1><span class="sub">jeden budynek na raz · obracaj przeciągając, przybliżaj kółkiem/szczypnięciem</span><a href="./">← gra</a></header>
  <nav id="list"><input id="q" placeholder="szukaj: ulica, numer, id…" /><div id="items"></div></nav>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="hud"><b id="hTitle">wybierz budynek z listy</b><span id="hSub"></span></div>
    <div id="tools"><button class="btn alt" id="bReset" disabled>reset stylu</button><button class="btn" id="bGlb" disabled>pobierz .glb</button></div>
  </main>
  <aside id="side">
    <div><h2>Fakty</h2><div id="facts">—</div></div>
    <div><h2>Styl (JSON) — zmień i zastosuj</h2><textarea id="style"></textarea><div class="row" style="margin-top:6px"><button class="btn" id="bApply" disabled>zastosuj</button><span class="msg" id="styleMsg"></span></div></div>
    <div><h2>Instrukcje dla Claude'a</h2><textarea id="note" placeholder="np. „dach ma być bardziej stromy, ganek drewniany z łukami jak na zdjęciu z 1910, okna parteru z okiennicami, cegła ciemniejsza”"></textarea><div class="row" style="margin-top:6px"><button class="btn" id="bSave" disabled>zapisz notatkę</button><span class="msg" id="noteMsg"></span></div><div id="notes"></div></div>
    <div><h2>Odniesienia</h2><div id="refs">—</div></div>
  </aside>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
